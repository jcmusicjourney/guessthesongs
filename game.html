<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="UTF-8"><title>看圖估歌</title></head>
<body><div id="game"></div>
<script src="questions.js"></script>
<script>
const p=new URLSearchParams(location.search);
const d=p.get('difficulty')||'easy';
const qs=[...QUESTIONS[d]].sort(()=>Math.random()-0.5).slice(0,10);
let i=0,s=0,t0=Date.now();
const g=document.getElementById('game');
function render(){const q=qs[i];g.innerHTML=`<img src="${q.image}" width=300><br>`+q.options.map((o,j)=>`<button onclick=ans(${j})>${o}</button>`).join('');}
function ans(c){const q=qs[i];if(c===q.answer)s++;g.innerHTML=`<p>${c===q.answer?'✅ 正確':'❌ 錯誤'}</p><p>答案：${q.options[q.answer]}</p><p>歌詞：${q.lyric}</p><button onclick=next()>下一題</button>`;}
function next(){i++;i<qs.length?render():end();}
function end(){const t=Math.floor((Date.now()-t0)/1000);g.innerHTML=`<h2>完成</h2><p>正確題數：${s}/${qs.length}</p><p>所需時間：${t} 秒</p>`;}
render();
</script></body></html>
