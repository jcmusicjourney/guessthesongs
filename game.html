<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>看圖估歌</title>
  <style>
    body{font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;background:#f5f6f7;margin:0;display:flex;justify-content:center}
    .container{max-width:480px;padding:20px;text-align:center}
    img{max-width:100%;border-radius:12px;margin:16px 0}
    button{width:100%;padding:14px;margin:10px 0;font-size:1rem;border:none;border-radius:8px;background:#0d6efd;color:#fff}
    .correct{color:#198754;font-weight:bold}
    .wrong{color:#dc3545;font-weight:bold}
    .lyric{background:#fff;padding:10px;border-radius:8px;font-style:italic}
  </style>
</head>
<body>
<div class="container" id="game"></div>
<script>
const QUESTIONS={easy:[{image:"https://placehold.co/400x250",options:["吻別","情書","每天愛你多一些"],answer:0,lyric:"我和你吻別 在無人的街"}],hard:[{image:"https://placehold.co/400x250",options:["分手總要在雨天","我哭了","偷心"],answer:0,lyric:"連綿夜雨 也似這天"}]};
const p=new URLSearchParams(location.search);const d=p.get('difficulty')||'easy';
const qs=[...QUESTIONS[d]];let i=0,s=0;const t0=Date.now();const g=document.getElementById('game');
function q(){const o=qs[i];g.innerHTML=`<img src="${o.image}">${o.options.map((x,j)=>`<button onclick="a(${j})">${x}</button>`).join('')}`}
function a(c){const o=qs[i];if(c===o.answer)s++;g.innerHTML=`<img src="${o.image}"><p class="${c===o.answer?'correct':'wrong'}">${c===o.answer?'✅ 答對':'❌ 答錯'}</p><p>答案：${o.options[o.answer]}</p><div class="lyric">${o.lyric}</div><button onclick=next()>下一題</button>`}
function next(){i++;i<qs.length?q():r()}
function r(){const t=Math.floor((Date.now()-t0)/1000);g.innerHTML=`<h2>完成</h2><p>正確題數：${s}/${qs.length}</p><p>所需時間：${t} 秒</p><a href='index.html'>返回首頁</a>`}
q();
</script>
</body>
</html>
